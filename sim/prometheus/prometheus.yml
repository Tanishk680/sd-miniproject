global:
  scrape_interval: 2s
  scrape_timeout: 1500ms
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["127.0.0.1:9460"]

  - job_name: user-service
    static_configs:
      - targets: ["127.0.0.1:9461"]

  - job_name: product-service
    static_configs:
      - targets: ["127.0.0.1:9462"]

  - job_name: order-service
    static_configs:
      - targets: ["127.0.0.1:9463"]

  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets: ["127.0.0.1:18080"]
